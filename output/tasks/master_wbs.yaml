    status: done
  - id: T-0003
    title: Generate Per-Task Prompt Template
    objective: Create the template prompt for guiding the AI through individual sub-tasks.
    deliverable_path: ./output/solution/prompts/03_per_task_template.md
    method_hint: Extract and reformat §3 from solve.md.
    status: done
  - id: T-0004
    title: Generate Logging Standards Prompt
    objective: Create the prompt section defining the required logging and metadata formats.
    deliverable_path: ./output/solution/prompts/04_logging_metadata_standards.md
