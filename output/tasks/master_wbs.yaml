    method_hint: Extract and reformat §1 from solve.md.
    status: done
  - id: T-0002
    title: Generate Bootstrap Prompt
    objective: Create the prompt detailing the AI's initial actions upon launch.
    deliverable_path: ./output/solution/prompts/02_bootstrap_prompt.md
